name: Update gold prices

on:
  workflow_dispatch:
  schedule:
    # Daily 02:45 UTC ≈ 08:30 NPT — Fenegosida publishes morning rates.
    - cron: '45 2 * * *'

permissions:
  contents: write

concurrency:
  group: gold-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install site dependencies
        run: npm ci

      - name: Update prices from Fenegosida API
        run: python -u -m scraper

      - name: Validate price data
        run: python -u -m scraper.validate data/prices.json

      - name: Build site
        run: npm run build

      - name: Commit canonical data
        run: |
          git config user.name "${{ secrets.MAIN_USERNAME || 'goldmandu-bot' }}"
          git config user.email "${{ secrets.MAIN_EMAIL || 'goldmandu-bot@users.noreply.github.com' }}"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update gold prices [skip ci]"
            git push origin HEAD
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify n8n on success
        if: success() && secrets.N8N_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          curl --fail -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\":\"${{ github.sha }}\",\"run_id\":\"${{ github.run_id }}\"}"
