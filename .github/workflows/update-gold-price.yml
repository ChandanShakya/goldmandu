name: Update gold prices

on:
  workflow_dispatch:
  schedule:
    # Daily 02:45 UTC ≈ 08:30 NPT — Fenegosida publishes morning rates.
    - cron: '45 2 * * *'

permissions:
  contents: write

concurrency:
  group: gold-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update prices from Fenegosida API
        run: python -u -m scraper --no-site-copy

      - name: Validate price data
        run: python -u -m scraper.validate data/prices.json

      - name: Commit canonical data
        id: commit
        run: |
          git config user.name "${{ secrets.MAIN_USERNAME || 'goldmandu-bot' }}"
          git config user.email "${{ secrets.MAIN_EMAIL || 'goldmandu-bot@users.noreply.github.com' }}"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes to commit."
          else
            git commit -m "Update gold prices [skip ci]"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: if you use a Cloudflare Pages deploy hook instead of
      # git integration, set secret CLOUDFLARE_DEPLOY_HOOK to the hook URL.
      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit.outputs.changed == 'true' && secrets.CLOUDFLARE_DEPLOY_HOOK != ''
        continue-on-error: true
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl --fail -X POST "$CLOUDFLARE_DEPLOY_HOOK"

      - name: Notify n8n on success
        if: success() && secrets.N8N_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          curl --fail -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\":\"${{ github.sha }}\",\"run_id\":\"${{ github.run_id }}\"}"

