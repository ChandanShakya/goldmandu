name: Update gold prices

on:
  workflow_dispatch:
  schedule:
    # Daily 02:45 UTC ≈ 08:30 NPT — Fenegosida publishes morning rates.
    - cron: '45 2 * * *'

permissions:
  contents: write

concurrency:
  group: gold-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets cannot be used in `if:` — expose as env and test in bash.
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
      GIT_USER_NAME: ${{ secrets.MAIN_USERNAME || 'goldmandu-bot' }}
      GIT_USER_EMAIL: ${{ secrets.MAIN_EMAIL || 'goldmandu-bot@users.noreply.github.com' }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies (web-push)
        run: npm ci

      - name: Update prices from Fenegosida API
        run: |
          python -u -c "from scraper.update import main; raise SystemExit(main(['--no-site-copy']))"

      - name: Validate price data
        run: |
          python -u -c "from scraper.validate import main; raise SystemExit(main(['data/prices.json']))"

      - name: Commit canonical data
        id: commit
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes to commit."
          else
            git commit -m "Update gold prices"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK not set; skip (git integration rebuilds Pages)."
            exit 0
          fi
          curl --fail -X POST "$CLOUDFLARE_DEPLOY_HOOK"

      - name: Send daily rate push notification
        continue-on-error: true
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Push secrets not configured; skip."
            exit 0
          fi
          node scripts/send-push.mjs

      - name: Notify n8n on success
        if: success()
        continue-on-error: true
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL not set; skip."
            exit 0
          fi
          curl --fail -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\":\"${{ github.sha }}\",\"run_id\":\"${{ github.run_id }}\"}"
