name: Android release

# Signed APK → GitHub Releases.
#
# Triggers:
#   - Every push to main that touches android/** (auto version 1.0.<run_number>)
#   - Tag v1.2.3 (version from tag)
#   - Manual workflow_dispatch
#
# Required repo secrets (see android/signing/GITHUB_SECRETS.txt):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (optional; default 1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          RUN="${{ github.run_number }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            NAME="${{ github.event.inputs.version }}"
            NAME="${NAME#v}"
          else
            # Auto: 1.0.<run_number> — increments every workflow run
            NAME="1.0.${RUN}"
          fi
          IFS=. read -r MAJ MIN PAT <<<"${NAME}.0.0"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=${NAME} versionCode=${CODE}"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add signing secrets (android/signing/GITHUB_SECRETS.txt)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          ls -la "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.ver.outputs.name }}"
          VERSION_CODE="${{ steps.ver.outputs.code }}"

          gradle :app:assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

          OUT="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$OUT" ]; then
            echo "Expected APK missing: $OUT"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/dist"
          DEST="$RUNNER_TEMP/dist/GoldMandu-${VERSION_NAME}.apk"
          cp "$OUT" "$DEST"
          SIZE=$(wc -c < "$DEST")
          echo "APK: $DEST ($(( SIZE / 1024 )) KB)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldMandu-${{ steps.ver.outputs.name }}
          path: ${{ runner.temp }}/dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GoldMandu ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          body: |
            GoldMandu Android `${{ steps.ver.outputs.name }}` (versionCode `${{ steps.ver.outputs.code }}`)

            Signed minified APK. Install with unknown sources allowed.

            API: `/api/latest.json` · UI mockup: `android/design/preview.html`
          files: |
            ${{ runner.temp }}/dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
